services:
  - type: web
    name: dabi-subway-runner
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_all.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: dabi_plays_bot
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SEC
        value: "7200"
      - key: DATABASE_URL
        value: sqlite:///./runner.db
